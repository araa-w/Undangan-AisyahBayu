<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu - Aisyah & Bayu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* --- TEMA WARNA & FONT --- */
        :root {
            --bg-green: #838266;
            --bg-cream: #FFF8E7;
            --text-dark: #4a5d3f;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background: var(--bg-green); 
            color: var(--bg-cream); 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
        }

        .main-wrapper { 
            max-width: 500px; 
            width: 100%; 
            background: var(--bg-cream); 
            border-radius: 15px; 
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            color: var(--text-dark);
        }

        /* --- BRIDGING / BRIDE & GROOM SECTION --- */
        .header-section {
            text-align: center;
            padding: 40px 20px 20px;
            border-bottom: 2px dashed rgba(74, 93, 63, 0.2);
        }

        .header-section .small-title {
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .header-section h1 {
            font-family: 'Times New Roman', serif; /* Font klasik ala undangan */
            font-size: 2.8rem;
            font-style: italic;
            margin: 0 0 10px 0;
            color: var(--bg-green);
        }

        .header-section .date {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .header-section .intro-text {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #555;
            margin: 0 auto;
            max-width: 350px;
        }

        /* --- FORM & SLIDESHOW SECTION --- */
        .wishes-section {
            padding: 30px 20px;
            text-align: center;
        }

        .wishes-section h2 {
            font-family: 'Times New Roman', serif;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box;
            font-family: inherit;
        }
        
        button { 
            background: var(--bg-green); 
            color: var(--bg-cream); 
            padding: 12px 20px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover { background: var(--text-dark); }
        button:disabled { background: #ccc; cursor: not-allowed; }

        /* SLIDESHOW */
        .slideshow-container { 
            position: relative; 
            height: 150px; 
            margin-top: 30px; 
            overflow: hidden; 
            background: rgba(131, 130, 102, 0.1); /* Background tipis buat ucapan */
            border-radius: 8px;
            padding: 20px;
        }

        .slide { 
            position: absolute; 
            width: calc(100% - 40px); /* Kurangi padding */
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); /* Posisi persis di tengah */
            opacity: 0; 
            transition: opacity 1s ease-in-out; 
            pointer-events: none; 
        }

        .slide.active { opacity: 1; pointer-events: auto; }
        .slide h4 { margin: 0 0 8px 0; color: var(--text-dark); font-size: 1rem; }
        .slide p { margin: 0; font-size: 0.85rem; font-style: italic; color: #555; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- 1. BAGIAN BRIDGING (BRIDE & GROOM) -->
        <div class="header-section">
            <p class="small-title">The Wedding Of</p>
            <h1>Aisyah & Bayu</h1>
            <p class="date">Sabtu, 07 November 2026</p>
            <p class="intro-text">
                Merupakan suatu kebahagiaan bagi kami menerima doa dan restu dari Anda. Silakan tinggalkan pesan manis Anda di bawah ini.
            </p>
        </div>

        <!-- 2. BAGIAN FORM & BUKU TAMU -->
        <div class="wishes-section">
            <h2>Kirim Doa & Harapan</h2>
            
            <form id="wishForm">
                <input type="text" id="nama" name="nama" placeholder="Nama Anda" required>
                <textarea id="ucapan" name="ucapan" placeholder="Tulis doa untuk pengantin..." rows="3" required></textarea>
                <button type="submit" id="btnSubmit">Kirim Pesan</button>
            </form>

            <div class="slideshow-container" id="slideshowBox">
                <p style="font-size:0.8rem; color:#888; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);">Memuat ucapan...</p>
            </div>
        </div>

    </div>

    <script>
        // --- JAVASCRIPT ---
        const SCRIPT_URL = 'SCRIPT_URL_KAMU_DISINI'; // <-- GANTI PAKAI LINK APPS SCRIPT!
        let currentSlide = 0;
        let slideInterval;

        function loadWishes() {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    const box = document.getElementById('slideshowBox');
                    box.innerHTML = ''; 

                    if (data.length === 0) {
                        box.innerHTML = '<p style="color:#888; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);">Jadilah yang pertama memberi ucapan!</p>';
                        return;
                    }

                    data.forEach((item, index) => {
                        let div = document.createElement('div');
                        div.className = index === 0 ? 'slide active' : 'slide';
                        div.innerHTML = `<h4>${item.nama}</h4><p>"${item.ucapan}"</p>`;
                        box.appendChild(div);
                    });

                    clearInterval(slideInterval);
                    if (data.length > 1) {
                        slideInterval = setInterval(showNextSlide, 4000);
                    }
                })
                .catch(err => console.log('Error:', err));
        }

        function showNextSlide() {
            const slides = document.querySelectorAll('.slide');
            if (slides.length === 0) return;

            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        document.getElementById('wishForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Mengirim...";
            btn.disabled = true;

            const formData = new FormData(this);

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    this.reset();
                    btn.innerText = "Kirim Pesan";
                    btn.disabled = false;
                    loadWishes(); 
                })
                .catch(err => {
                    alert("Gagal kirim, coba lagi.");
                    btn.innerText = "Kirim Pesan";
                    btn.disabled = false;
                });
        });

        loadWishes();
    </script>
</body>
</html>
